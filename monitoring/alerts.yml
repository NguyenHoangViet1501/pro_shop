groups:
  - name: ec2-host-alerts
    rules:
      - alert: HighCpuUsage
        expr: 100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "EC2 CPU usage is above 85%"
          description: "CPU usage is above 85%. Current value: {{ $value | printf \"%.2f\" }}%."
