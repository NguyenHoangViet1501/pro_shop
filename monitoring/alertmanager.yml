global:
  resolve_timeout: 5m

route:
  receiver: telegram
  group_by:
    - alertname
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 30m

receivers:
  - name: telegram
    telegram_configs:
      - bot_token: "8800680036:AAHwFsG8PMUlWTL2vfIVWeijVWF8ppQgRgo"
        chat_id: 6151502857
        parse_mode: HTML
        message: '{{ range .Alerts }}<b>{{ .Status | toUpper }}</b> {{ .Labels.alertname }}\n{{ .Annotations.summary }}\n{{ .Annotations.description }}{{ end }}'
