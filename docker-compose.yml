services:
  mongo:
    image: mongo:6
    container_name: proshop_mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - proshop_network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: proshop_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/proshop
      JWT_SECRET: abc123
      PAYPAL_CLIENT_ID: sb
    depends_on:
      - mongo
    expose:
      - "5000"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - proshop_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: proshop_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot_www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
      - nginx_logs:/var/log/nginx/proshop
    networks:
      - proshop_network

  certbot:
    image: certbot/certbot
    container_name: proshop_certbot
    volumes:
      - certbot_www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    networks:
      - proshop_network

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: proshop_prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - node-exporter
    networks:
      - proshop_network

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: proshop_node_exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave
    expose:
      - "9100"
    networks:
      - proshop_network

  loki:
    image: grafana/loki:2.9.10
    container_name: proshop_loki
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/local-config.yaml
    expose:
      - "3100"
    volumes:
      - loki_data:/loki
    networks:
      - proshop_network

  promtail:
    image: grafana/promtail:2.9.10
    container_name: proshop_promtail
    restart: unless-stopped
    command:
      - -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./monitoring/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - nginx_logs:/var/log/nginx/proshop:ro
    depends_on:
      - loki
      - frontend
    networks:
      - proshop_network

volumes:
  mongo_data:
  uploads_data:
  certbot_www:
  letsencrypt:
  prometheus_data:
  loki_data:
  nginx_logs:

networks:
  proshop_network:
    driver: bridge
