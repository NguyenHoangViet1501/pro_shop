services:
  mongo:
    image: mongo:6
    container_name: proshop_mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - proshop_network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: proshop_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/proshop
      JWT_SECRET: abc123
      PAYPAL_CLIENT_ID: sb
    depends_on:
      - mongo
    expose:
      - "5000"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - proshop_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: proshop_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot_www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    networks:
      - proshop_network

  certbot:
    image: certbot/certbot
    container_name: proshop_certbot
    volumes:
      - certbot_www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    networks:
      - proshop_network

volumes:
  mongo_data:
  uploads_data:
  certbot_www:
  letsencrypt:

networks:
  proshop_network:
    driver: bridge
